<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Princy · AI Development</title>
  <desc id="d">Hero banner with a neural network motif</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="s1"/>
      <stop offset="1" class="s2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff6b9d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .s1{stop-color:#fbf9ff} .s2{stop-color:#ece6ff}
    .ink{fill:#1b1530} .sub{fill:#5b5478} .tag{fill:#7c5cff}
    .edge{stroke:#b9a9ff;stroke-width:1.2;opacity:.55}
    .frame{stroke:#d8cfff}
    .n.a{fill:#7c5cff} .n.b{fill:#ff6b9d} .n.c{fill:#4cc9b0}
    .n{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.35);opacity:1}}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .s1{stop-color:#15111f} .s2{stop-color:#201a38}
      .ink{fill:#f5f1ff} .sub{fill:#b6acd9} .tag{fill:#a894ff}
      .edge{stroke:#4a3d86;opacity:.8} .frame{stroke:#352c61}
    }
    @media (prefers-reduced-motion: reduce){ .n{animation:none} }
  </style>

  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#bg)" class="frame" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#glow)"/>

  <!-- text -->
  <text x="70" y="108" class="mono tag" font-size="18" letter-spacing="2">HI, I'M</text>
  <text x="66" y="188" class="sans ink" font-size="92" font-weight="800" letter-spacing="-2">Princy</text>
  <rect x="70" y="208" width="84" height="5" rx="2.5" fill="url(#bar)"/>
  <text x="70" y="250" class="sans sub" font-size="24">AI Development student · analyzing, building, publishing</text>
  <text x="70" y="286" class="mono tag" font-size="14" letter-spacing="3">DATA  ·  MODELS  ·  PRODUCTS</text>

