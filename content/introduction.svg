    .pls{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 100;stroke-dashoffset:12;animation:flow 5s linear infinite}
    .breathe{transform-box:fill-box;transform-origin:center;animation:br 4.5s ease-in-out infinite}
    .sweep{animation:sweep 5s ease-in-out infinite} .drift{animation:drift 10s ease-in-out infinite} .drift2{animation:drift 13s ease-in-out infinite reverse}
    @keyframes flow{0%{stroke-dashoffset:12}100%{stroke-dashoffset:-100}} @keyframes br{50%{transform:scale(1.5)}}
    @keyframes sweep{0%{transform:translateY(-50px)}100%{transform:translateY(250px)}} @keyframes drift{50%{transform:translate(24px,-12px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}.sweep{display:none}}
    .sb1{stop-color:#240d16}.sb2{stop-color:#4a1526}.sa1{stop-color:#fb923c}.sa2{stop-color:#f43f5e}.sa3{stop-color:#fbbf24}
.ink{fill:#ffffff}.lab{fill:#fdba74}.tag{fill:#fb923c}.bgc{fill:#240d16}
